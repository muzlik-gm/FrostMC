# FrostSMP Fragment Power System Configuration

rituals:
  fragment_creation:
    duration: 180  # 3 minutes in seconds
    proximity_distance: 12.0
  fragment_changer:
    duration: 150  # 2.5 minutes
    cooldown: 3600  # 1 hour
    proximity_distance: 10.0

mana:
  base_max: 100.0
  rank_bonus: 50.0
  base_regen_rate: 1.0
  level_regen_bonus: 0.1

# Character Level - Determines max mana capacity
# Separate from Fragment Level which handles ability progression
character:
  max_level: 100           # Maximum character level
  mana_per_level: 10.0     # Mana gained per level
  base_mana: 160         # Base mana at level 1
  base_xp_required: 120.0  # XP required from level 1 to 2
  xp_scaling: 1.15         # XP requirement multiplier per level

leveling:
  max_level: 50
  prestige_enabled: true
  death_xp_loss_enabled: false

ui:
  default_mode: STANDARD
  mana_display: BOSS_BAR  # or ACTION_BAR
  show_cooldowns: true

fx:
  debug_mode: false
  particle_density: 1.0  # Multiplier for all particles
  sound_volume: 1.0

block_manipulation:
  allow_real_blocks: true  # Allow real falling block entities (prefer particle shells for safety)
  max_lifetime_ticks: 120   # Maximum lifetime for block controllers (6 seconds)

vfx:
  rank_scaling_multiplier: 0.08  # Particle count increase per rank (8% per rank)
  enable_performance_throttling: true  # Automatically reduce particles when TPS drops
  tps_monitoring_interval: 100  # Ticks between TPS checks (100 = 5 seconds)

fragments:
  fire:
    base_rank: 3
    xp_curve: EXPONENTIAL
    death_xp_penalty: 0.1  # 10% XP loss
  water:
    base_rank: 2
    xp_curve: LINEAR
    death_xp_penalty: 0.05
  air:
    base_rank: 3
    xp_curve: LOGARITHMIC
    death_xp_penalty: 0.08
  earth:
    base_rank: 2
    xp_curve: LINEAR
    death_xp_penalty: 0.05
  dark:
    base_rank: 4
    xp_curve: EXPONENTIAL
    death_xp_penalty: 0.15
  light:
    base_rank: 4
    xp_curve: EXPONENTIAL
    death_xp_penalty: 0.12
  void:
    base_rank: 7
    xp_curve: EXPONENTIAL
    death_xp_penalty: 0.20
  mob:
    base_rank: 5
    xp_curve: LINEAR
    death_xp_penalty: 0.10
  dragon:
    base_rank: 8
    xp_curve: EXPONENTIAL
    death_xp_penalty: 0.25
  storm:
    base_rank: 6
    xp_curve: EXPONENTIAL
    death_xp_penalty: 0.18
