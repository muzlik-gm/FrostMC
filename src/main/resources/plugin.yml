name: FrostSMP
version: 1.0.0
main: com.muzlik.FrostSMPPlugin
api-version: 1.21
description: A Fragment-based power system with 10 unique fragments and custom abilities
authors: [muzlik]
website: https://muzlik.com
softdepend: [WorldEdit, FastAsyncWorldEdit, DiscordSRV]

commands:
  fragment:
    description: Fragment system commands
    usage: /fragment <give|list|mana|grant|controls>
    aliases: [frag, f]
    permission: frostmc.fragment
    permission-message: You don't have permission to use fragments
  controls:
    description: Open control scheme selection GUI
    usage: /controls
    permission: frostmc.fragment
    permission-message: You don't have permission to use this command
  testtexture:
    description: Test custom model data textures (debug)
    usage: /testtexture <texture_name>
    permission: frostmc.admin
    permission-message: You don't have permission to use this command

permissions:
  frostmc.fragment:
    description: Allows using fragments
    default: true
  frostmc.admin:
    description: Admin access to fragment commands
    default: op
  fragment.admin:
    description: Admin access to fragment commands
    default: op
