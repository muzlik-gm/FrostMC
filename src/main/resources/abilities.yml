# Fragment Abilities Configuration
# Anime RPG Style Ability System

# Mana Economy
mana:
  base: 100
  per_rank: 20
  per_level: 5
  regen_base: 2.0
  regen_per_rank: 0.5

# Ability Tiers
tiers:
  basic:
    mana_min: 15
    mana_max: 25
    cooldown_min: 3000
    cooldown_max: 6000
  skill:
    mana_min: 30
    mana_max: 40
    cooldown_min: 8000
    cooldown_max: 12000
  ultimate:
    mana_min: 50
    mana_max: 70
    cooldown_min: 15000
    cooldown_max: 25000
  advanced:
    mana_min: 45
    mana_max: 65
    cooldown_min: 15000
    cooldown_max: 20000
  mastery:
    mana_min: 80
    mana_max: 100
    cooldown_min: 60000
    cooldown_max: 90000

# Scaling Formulas
scaling:
  damage: 0.15
  defense: 0.10
  healing: 0.12
  duration: 0.08
  range: 0.05
  mana_cost: 0.10

# Ritual Durations (seconds)
rituals:
  fragment_creation: 60
  fragment_changer: 30
  rank_up: 45
  ability_expansion: 120
  mastery_expansion: 180

# Slot Unlock Thresholds
unlock_thresholds:
  fire:
    slot_3: 5
    slot_4: 7
  water:
    slot_3: -1  # Cannot unlock
    slot_4: -1
  air:
    slot_3: 5
    slot_4: 7
  dark:
    slot_3: 6
    slot_4: 8
  light:
    slot_3: 6
    slot_4: 8
  storm:
    slot_3: 8
    slot_4: 10
  void:
    slot_3: 9
    slot_4: 11
  dragon:
    slot_3: 10
    slot_4: 12
  time:
    slot_3: 4
    slot_4: 6
  luck:
    slot_3: 4
    slot_4: 6

# Time Fragment Abilities
time_abilities:
  temporal_slow:
    mana_cost_base: 30
    mana_cost_reduction: 5
    cooldown_base: 18000
    cooldown_reduction: 1500
    duration_base: 5
    duration_per_rank: 1
    range: 20
    slowness_amplifier_formula: "rank / 2"
  
  time_acceleration:
    mana_cost_base: 40
    mana_cost_reduction: 5
    cooldown_base: 20000
    cooldown_reduction: 2000
    duration_base: 8
    duration_per_rank: 2
    speed_amplifier_formula: "1 + (rank / 4)"
    haste_amplifier_formula: "1 + (rank / 4)"
  
  temporal_rewind:
    mana_cost_base: 60
    mana_cost_reduction: 5
    cooldown_base: 45000
    cooldown_reduction: 3000
    rewind_seconds: 5
    history_buffer_size: 10
    rank_requirement: 4
  
  chrono_stasis:
    mana_cost_base: 50
    mana_cost_reduction: 5
    cooldown_base: 30000
    cooldown_reduction: 2000
    duration_base: 3
    duration_per_rank: 0.5
    range: 15
    max_targets_formula: "1 + (rank / 3)"
    rank_requirement: 6
  
  time_dilation_field:
    mana_cost_base: 70
    mana_cost_reduction: 5
    cooldown_base: 60000
    cooldown_reduction: 4000
    duration_base: 10
    duration_per_rank: 2
    radius_base: 8
    radius_per_rank: 1
    ally_speed_formula: "rank / 3"
    enemy_slowness_formula: "rank / 3"
    rank_requirement: 7

# Luck Fragment Abilities
luck_abilities:
  fortune_strike:
    mana_cost_base: 35
    mana_cost_reduction: 4
    cooldown_base: 15000
    cooldown_reduction: 1000
    duration_base: 10
    duration_per_rank: 1
    crit_chance_base: 0.30
    crit_chance_per_rank: 0.05
    crit_multiplier_base: 1.5
    crit_multiplier_per_rank: 0.1
  
  lucky_dodge:
    mana_cost_base: 30
    mana_cost_reduction: 3
    cooldown_base: 18000
    cooldown_reduction: 1500
    duration_base: 8
    duration_per_rank: 1
    evasion_chance_base: 0.25
    evasion_chance_per_rank: 0.05
    evasion_chance_max: 0.75
  
  treasure_hunter:
    mana_cost_base: 45
    mana_cost_reduction: 4
    cooldown_base: 40000
    cooldown_reduction: 3000
    duration_base: 15
    duration_per_rank: 2
    drop_multiplier_base: 1.0
    drop_multiplier_per_rank: 0.2
    rare_drop_chance_base: 0.10
    rare_drop_chance_per_rank: 0.05
    rank_requirement: 4
  
  probability_manipulation:
    mana_cost_base: 55
    mana_cost_reduction: 5
    cooldown_base: 50000
    cooldown_reduction: 4000
    duration_base: 20
    duration_per_rank: 3
    luck_amplifier_formula: "rank / 2"
    fishing_treasure_bonus_base: 0.15
    fishing_treasure_bonus_per_rank: 0.05
    enchantment_bonus_formula: "rank / 2"
    rank_requirement: 6
  
  serendipity_aura:
    mana_cost_base: 65
    mana_cost_reduction: 5
    cooldown_base: 70000
    cooldown_reduction: 5000
    duration_base: 12
    duration_per_rank: 2
    radius_base: 10
    radius_per_rank: 1
    shared_luck_formula: "rank / 3"
    shared_crit_chance_base: 0.15
    shared_crit_chance_per_rank: 0.03
    rank_requirement: 7

# Luck Fragment Passive
luck_passive:
  luck_effect_amplifier: 5  # Luck VI
  fortune_enchantment_level: 5  # Fortune V
  tool_check_interval: 20  # ticks (1 second)
