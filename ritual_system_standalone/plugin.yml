name: ExampleRitualPlugin
version: 1.0.0
main: your.plugin.ritual.ExampleRitualPlugin
api-version: 1.20
author: YourName
description: Example plugin demonstrating the standalone ritual system

commands:
  ritual:
    description: Start a ritual
    usage: /ritual <type> <crystal>
    permission: ritual.use
  ritualitem:
    description: Get a ritual catalyst item
    usage: /ritualitem <type> <crystal>
    permission: ritual.admin

permissions:
  ritual.use:
    description: Allows using rituals
    default: true
  ritual.admin:
    description: Allows getting ritual items
    default: op

softdepend: [WorldEdit, FastAsyncWorldEdit]